name: CI/CD

on:
  push:
    branches: [ hotfix/principal ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # necessário para publicar no GHCR
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gera nome da imagem *todo em minúsculas*: ghcr.io/<owner>/<repo>
      - name: Compute lowercase image name
        id: meta
        shell: bash
        run: |
          repo_lc="${GITHUB_REPOSITORY,,}"                 # owner/repo -> minúsculas
          echo "repo_lc=$repo_lc" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$repo_lc" >> "$GITHUB_OUTPUT"
          echo "branch_tag=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | tr '/_' '-')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action @v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.branch_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
