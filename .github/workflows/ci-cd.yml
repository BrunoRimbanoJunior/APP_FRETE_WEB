name: CI/CD

on:
  push:
    branches: [hotfix/principal]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}


stages:
  - convert

convert_to_lowercase:
  stage: convert
  script:
    - ORIGINAL=$REGISTRY
    - REGISTRY=$(echo "$ORIGINAL" | tr '[:upper:]' '[:lower:]')
    - ORIGINAL=$IMAGEM_NAME
    - IMAGEM_NAME=$(echo "$ORIGINAL" | tr '[:upper:]' '[:lower:]')
    

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}