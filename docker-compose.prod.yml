services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fretes
      POSTGRES_USER: fretes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fretes -d fretes"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [fretes_net]

  web:
    image: ghcr.io/SEU_USUARIO/SEU_REPO:latest   # 👈 altere
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}                    # ex: 192.168.0.50,meu-servidor.local
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS}      # ex: http://192.168.0.50,http://meu-servidor.local
      DATABASE_URL: postgres://fretes:${POSTGRES_PASSWORD}@db:5432/fretes
      GUNICORN_WORKERS: 3
    volumes:
      - staticfiles:/app/staticfiles
    restart: unless-stopped
    networks: [fretes_net]

  nginx:
    image: nginx:1.27-alpine
    depends_on: [web]
    ports:
      - "80:80"
    volumes:
      - staticfiles:/app/staticfiles:ro
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks: [fretes_net]

volumes:
  pgdata:
  staticfiles:

networks:
  fretes_net:
