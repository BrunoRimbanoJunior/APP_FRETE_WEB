[project]
name = "app-frete-web"
version = "0.1.0"
description = "Gestão de fretes, pedidos e garantias"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dj-database-url==3.1.2",
    "django==5.2.18",
    "django-filter==26.2",
    "gunicorn==26.2.0",
    "openpyxl==3.1.5",
    "reportlab==5.0.1",
    "psycopg[binary]==3.3.6",
    "whitenoise[brotli]==6.12.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-django==4.14.0"]
browser = ["playwright==1.63.0"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "fretes_web.settings.dev"
testpaths = ["fretes/tests"]
