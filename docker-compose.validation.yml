name: fretes-validation

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: validation
      POSTGRES_USER: validation
      POSTGRES_PASSWORD: validation
    volumes:
      - validation_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U validation -d validation"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: app-frete-web:validation-20261007
    build: .
    environment:
      DATABASE_URL: postgresql://validation:validation@db:5432/validation
      POSTGRES_HOST: db
      DJANGO_SETTINGS_MODULE: fretes_web.settings.prod
      DJANGO_SECRET_KEY: validation-local-only-20261007-do-not-use-in-production
      DJANGO_DEBUG: "0"
      ALLOWED_HOSTS: localhost,127.0.0.1,web,nginx,testserver
      CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8083,http://localhost:8083
      CSRF_COOKIE_SECURE: "0"
      SESSION_COOKIE_SECURE: "0"
      GUNICORN_WORKERS: "2"
      VALIDATION_ONLY: "1"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/fretes/"]
      interval: 5s
      timeout: 5s
      retries: 20

  nginx:
    image: nginx:1.31.3-alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    ports:
      - "127.0.0.1:8083:80"
    volumes:
      - ./deploy/conf.d:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    depends_on:
      web:
        condition: service_healthy

volumes:
  validation_pgdata:
