<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Fretes{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-body-tertiary mb-4">
      <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'fretes:index' %}">Fretes</a>
      <div class="navbar-nav">
        <a class="nav-link" href="{% url 'fretes:pedido_list' %}">Pedidos</a>  <!-- ✅ novo -->
      <a class="nav-link" href="{% url 'fretes:calcular' %}">Calcular</a>
      <a class="nav-link" href="{% url 'fretes:relatorios' %}">Relatórios</a>
      <a class="nav-link" href="/admin/">Admin</a>
    </div>
  </div>
</nav>

    <main class="container">
      {% if messages %}
        {% for m in messages %}
          <div class="alert alert-{{ m.tags }}">{{ m }}</div>
        {% endfor %}
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
