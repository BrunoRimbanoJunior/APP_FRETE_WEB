{% for p in qs %}
  {% if value and value == p.codigo %}
    <option value="{{ p.codigo }}" selected>{{ p.codigo }}{% if p.rtg %} | RTG: {{ p.rtg }}{% endif %} - {{ p.descricao }}</option>
  {% else %}
    <option value="{{ p.codigo }}">{{ p.codigo }}{% if p.rtg %} | RTG: {{ p.rtg }}{% endif %} - {{ p.descricao }}</option>
  {% endif %}
{% endfor %}
