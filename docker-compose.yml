
services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env.dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Use $$ para NÃO expandir no parse do compose; expande dentro do container
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.dev
    environment:
      DJANGO_SETTINGS_MODULE: fretes_web.settings.dev
      # Opcional: sobrescrever workers/timeouts em dev
      GUNICORN_WORKERS: "2"
      GUNICORN_TIMEOUT: "60"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # sobe gunicorn em 8000 (ver entrypoint)
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    expose:
      - "8000"
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
