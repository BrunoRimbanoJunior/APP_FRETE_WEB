services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fretes
      POSTGRES_USER: fretes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data      # ✅ caminho correto
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks: [fretes_net]

  web:
    build: .
    depends_on: [db]
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS}
      DATABASE_URL: postgres://fretes:${POSTGRES_PASSWORD}@db:5432/fretes
      GUNICORN_WORKERS: 3
    volumes:
        - ./fretes:/app/fretes
        - ./APP_FRETE_WEB:/app/APP_FRETE_WEB
        - ./manage.py:/app/manage.py
        # Remova a linha abaixo se não precisar coletar staticos
        - staticfiles:/app/staticfiles       # ✅ volume nomeado
    restart: unless-stopped
    networks: [fretes_net]
    command: >
      uv run gunicorn APP_FRETE_WEB.wsgi:application
      --bind 0.0.0.0:8000
      --access-logfile -
      --error-logfile -
      --log-level debug

  nginx:
    image: nginx:1.27-alpine
    depends_on: [web]
    ports:
      - "80:80"
    volumes:
      - staticfiles:/app/staticfiles:ro      # ✅ mesmo volume lido em RO
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks: [fretes_net]

volumes:                                      # ✅ DEFINIÇÃO dos volumes
  pgdata:
  staticfiles:

networks:
  fretes_net:


