services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env.dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups:ro
      - ./deploy/db-tools/backup_restore.sh:/usr/local/bin/backup_restore.sh:ro
    healthcheck:
      # Use $$ para NAO expandir no parse do compose; expande dentro do container
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.dev
    environment:
      DJANGO_SETTINGS_MODULE: fretes_web.settings.dev
      # Opcional: sobrescrever workers/timeouts em dev
      GUNICORN_WORKERS: "2"
      GUNICORN_TIMEOUT: "60"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # sobe gunicorn em 8000 (ver entrypoint)
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web
    restart: unless-stopped

  auto-backup:
    image: alpine:latest
    container_name: auto_backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.dev
    environment:
      PG_CLIENT_MAJOR: "16"
    volumes:
      - ./backups:/backups
      - ./deploy/auto-backup:/opt/auto-backup:ro
    command: >
      sh -c "
        # Instala cliente Postgres (mesma major do servidor) e timezone
        apk add --no-cache postgresql$${PG_CLIENT_MAJOR}-client tzdata && 

        # Garante diretÃ³rio de backups
        mkdir -p /backups && 

        # Copia o script versionado e normaliza EOL (CRLF -> LF)
        cp /opt/auto-backup/backup.sh /usr/local/bin/backup.sh && 
        sed -i 's/\r$//' /usr/local/bin/backup.sh && 
        chmod +x /usr/local/bin/backup.sh && 

        # Agenda para 04:00 e 16:00
        echo '0 4,16 * * * /usr/local/bin/backup.sh >> /proc/1/fd/1 2>&1' > /etc/crontabs/root && 

        # Aguarda DB pronto e executa um backup inicial
        echo 'Aguardando banco ficar pronto...' && 
        until pg_isready -h "$$POSTGRES_HOST" -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"; do sleep 3; done && 
        /usr/local/bin/backup.sh && 
        echo 'Iniciando cron...' && 
        exec crond -f -l 8
      "

  dbtools:
    image: alpine:latest
    env_file:
      - .env.dev
    environment:
      PG_CLIENT_MAJOR: "16"
    volumes:
      - ./backups:/backups:ro
      - ./deploy/db-tools/backup_restore.sh:/usr/local/bin/backup_restore.sh:ro
    # Use via: docker compose run --rm dbtools sh -lc 'apk add --no-cache postgresql$PG_CLIENT_MAJOR-client && backup_restore.sh'

volumes:
  pgdata:

