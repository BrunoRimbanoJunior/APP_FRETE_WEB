services:
  web:
    image: ghcr.io/${GITHUB_OWNER:-OWNER}/${REPO_NAME:-APP_FRETE_WEB}:web-latest
    env_file: .env.prod
    depends_on:
      - db
    ports:
      - "8000:8000"     # ajuste se usar nginx à frente
    restart: always

  db:
    image: postgres:16-alpine
    env_file: .env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  # opcional: nginx reverso na frente do web
  # nginx:
  #   image: ghcr.io/OWNER/APP_FRETE_WEB:nginx-latest
  #   depends_on: [web]
  #   ports: ["80:80"]
  #   restart: always

volumes:
  pgdata: