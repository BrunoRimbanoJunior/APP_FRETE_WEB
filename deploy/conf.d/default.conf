log_format fretes_timing escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time"}';

# Resolve novamente o IP do servico web quando o Docker recria o container.
upstream fretes_backend {
    zone fretes_backend 64k;
    resolver 127.0.0.11 ipv6=off valid=5s;
    resolver_timeout 2s;
    server web:8000 resolve;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    # Redirecionamentos relativos preservam a porta publicada pelo Docker.
    absolute_redirect off;
    access_log /var/log/nginx/access.log fretes_timing;
    client_max_body_size 1m;

    # Preserva a porta do cliente e substitui headers encaminhados pelo cliente.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
    proxy_send_timeout 60s;
    # Buffering protege os workers sincronos do Gunicorn de clientes lentos.
    proxy_buffering on;
    proxy_request_buffering on;

    # Comprime HTML e respostas de texto antes de envia-las aos dispositivos.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location = / { return 301 /fretes/; }

    # Verifica apenas o Nginx; o web possui seu proprio healthcheck.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /fretes/ {
        proxy_pass http://fretes_backend;

        # Somente as ferramentas de importacao aceitam planilhas maiores.
        location = /fretes/admin/tools/importar-produtos/ {
            client_max_body_size 20m;
            proxy_pass http://fretes_backend;
        }
        location = /fretes/admin/tools/importar-clientes/ {
            client_max_body_size 20m;
            proxy_pass http://fretes_backend;
        }
    }
    location /admin/ {
        proxy_pass http://fretes_backend;
    }

    location /static/ {
        proxy_pass http://fretes_backend;
        access_log off;
    }

}
