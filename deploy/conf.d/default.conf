server {
    listen 80;
    server_name _;

    # Comprime HTML e respostas de texto antes de envia-las aos dispositivos.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location = / { return 301 /fretes/; }

    resolver 127.0.0.11 ipv6=off valid=30s;
    set $upstream http://web:8000;

    location /fretes/ {
        # O Nginx vai usar o DNS interno do Docker para resolver 'http://web:8000'
        proxy_pass http://web:8000;
        
        # O resto das configurações
        # Preserve host and port from the client (e.g., :8082)
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Script-Name /fretes;
    }
    location /admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Script-Name /admin;
    }

    location /static/ {
        proxy_pass http://web:8000;
        access_log off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

}
